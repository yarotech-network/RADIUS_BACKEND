<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="2; url=$(link-status)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Kada Space X - Connected</title>
    <link rel="stylesheet" href="style.css">
     
</head>

<body class="yarotech-portal">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap portal-card portal-success">
                <img class="portal-logo" src="img/kada-space-x-logo.png" alt="Kada Space X logo">
                <div class="success-check">&#10003;</div>
                <h1>Hotspot login successful</h1>
                <p class="portal-message">Opening your local session status.</p>
                <p class="info">If nothing happens, <a href="$(link-status)">view session status</a></p>
                <p class="powered-credit">Powered by Yarotech Group</p>
            </div>
        </div>
    </div>
</body>

</html>
