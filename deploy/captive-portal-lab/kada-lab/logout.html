<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />   
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Kada Space X - Logged Out</title>
<link rel="stylesheet" href="style.css">
<script>
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
</script>
</head>

<body class="yarotech-portal">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap portal-card">
                <img class="portal-logo" src="img/kada-space-x-logo.png" alt="Kada Space X logo">
                <p class="portal-brand">KADA SPACE X</p>
                <h1>You are now disconnected</h1>
                <p class="portal-message">Thank you for using Kada Space X WiFi.</p>
                <table>  
                    <tr><td>Username</td><td>$(username)</td></tr>
                    <tr><td>IP address</td><td>$(ip)</td></tr>
                    <tr><td>MAC address</td><td>$(mac)</td></tr>
                    <tr><td>Session time</td><td>$(uptime)</td></tr>
                    $(if session-time-left)
                    <tr><td>Time left</td><td>$(session-time-left)</td></tr>
                    $(endif)
                    <tr><td>Bytes up / down:</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
                </table>


                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <input type="submit" value="Connect Again">
                </form>
                <p class="powered-credit">Powered by Yarotech Group</p>
            </div>
        </div>
    </div>

</body>
</html>
