# FreeRADIUS 3.2 module template. Review with freeradius -XC before enabling.
rest yarotech_pppoe {
    connect_timeout = 3.0
    authenticate {
        uri = "$ENV{YAROTECH_API_ORIGIN}/api/v1/radius/pppoe/decision/"
        method = "post"
        body = "post"
        data = "username=%{urlencode:%{User-Name}}&password=%{urlencode:%{User-Password}}&packet_src_ip=%{urlencode:%{Packet-Src-IP-Address}}&service_type=%{urlencode:%{Service-Type}}&framed_protocol=%{urlencode:%{Framed-Protocol}}&nas_port_type=%{urlencode:%{NAS-Port-Type}}"
        force_to = "json"
        timeout = 4.0
        tls {
            check_cert = yes
            check_cert_cn = yes
        }
    }
}
