# Candidate: include inside the EXISTING HTTPS server blocks for test and shop.
# Keep their current SPA roots, assets, TLS certificates and HTTP redirects.
# Activate only after the staging backend is healthy on loopback port 8020.
location ^~ /api/v1/radius/ {
    return 404;
}
location ^~ /api/v1/ {
    access_log off;
    proxy_pass http://127.0.0.1:8020;
    # Both public entrypoints address the same backend API identity.
    proxy_set_header Host shop.yarotech.com.ng;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
