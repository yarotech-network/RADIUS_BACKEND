# Nginx configuration TEMPLATE (rendered by the nginx image's envsubst
# entrypoint — only ${API_UPSTREAM} is substituted; $uri/$host/etc. are nginx
# variables and are left untouched).
#
# Serves the built SPA and proxies the API on the same origin, so
# VITE_API_BASE_URL can stay at its default relative value (/api/v1) and no
# CORS configuration is needed.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Vite emits content-hashed filenames — cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every non-file path serves the app shell. The document is
  # never cached so releases propagate immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy (Django/Gunicorn behind the same host).
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Backend health endpoint through the same origin.
  location /health {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;
}
