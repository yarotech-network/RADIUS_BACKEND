components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 128
        username:
          type: string
          maxLength: 150
          minLength: 3
        password:
          type: string
          writeOnly: true
      required:
      - token
    AgentCreate:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        phone:
          type: string
          maxLength: 20
          minLength: 10
        shop_name:
          type: string
          maxLength: 200
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - email
      - password
      - phone
      - username
    AgentFundingPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        amount:
          type: integer
          readOnly: true
          description: Amount in kobo
        status:
          allOf:
          - $ref: '#/components/schemas/FundingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount
      - completed_at
      - created_at
      - id
      - reference
      - status
    AgentGeneratedVouchers:
      type: object
      properties:
        vouchers:
          type: array
          items:
            $ref: '#/components/schemas/AgentVoucherAllocation'
      required:
      - vouchers
    AgentLogin:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    AgentProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        phone:
          type: string
          maxLength: 20
        shop_name:
          type: string
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/AgentStatusEnum'
          readOnly: true
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        wallet_balance:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - commission_rate
      - created_at
      - id
      - phone
      - status
      - tenant
      - user
      - username
      - wallet_balance
    AgentStats:
      type: object
      properties:
        wallet_balance:
          type: integer
        vouchers_today:
          type: integer
        commission_this_month:
          type: integer
        total_vouchers:
          type: integer
      required:
      - commission_this_month
      - total_vouchers
